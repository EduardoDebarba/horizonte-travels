name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npx vinext build --prerender-all
        env:
          GITHUB_PAGES: 'true'

      - name: Assemble Pages artifact
        run: |
          rm -rf gh-pages
          mkdir -p gh-pages
          cp -R dist/client/. gh-pages/
          cp -R dist/server/prerendered-routes/. gh-pages/
          perl -0pi -e 's/(href|src)="\/(?!horizonte-travels\/)/$1="\/horizonte-travels\//g; s/url\(\/(?!horizonte-travels\/)/url\(\/horizonte-travels\//g' gh-pages/*.html gh-pages/*.rsc
          touch gh-pages/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
